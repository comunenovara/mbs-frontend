<div id="mbs-incentive-assignation-stage-new-update-form" *ngIf="stepIs(formStep.FORM)">
	<form [formGroup]="_newUpdateForm" (ngSubmit)="submit()">
		<div class="grid p-fluid" style="margin-top: 0px;">

			<div class="col-12 md:col-6 lg:col-4" [hidden]="assignationRole != null">
				<span>{{ 'assignationRole' }}</span><span class="filed-required">*</span>
				<input type="text" pInputText formControlName="assignationRole" [stalAutocomplete]="assignationRoleAutocomplete">
				<stal-autocomplete #assignationRoleAutocomplete [filteredElements]="_filteredAssignationRole" [displayFn]="mbsIncentiveAutocompleteService.displayIncentiveAssignationRole"></stal-autocomplete>
				<div *ngIf="!isValid(_newUpdateForm.controls['assignationRole'])" class="filed-required">
					<span *ngIf="checkControlError(_newUpdateForm.controls['assignationRole'], 'validatorHaveId')">La assignationRole è richiesta.</span>
				</div>
			</div>
			<div class="col-12 md:col-6 lg:col-4" [hidden]="assignationRoleValue != null">
				<span>{{ 'assignationRoleValue' }}</span><span class="filed-required">*</span>
				<input type="text" pInputText formControlName="assignationRoleValue" [stalAutocomplete]="assignationRoleValueAutocomplete">
				<stal-autocomplete #assignationRoleValueAutocomplete [filteredElements]="_filteredAssignationRoleValue" [displayFn]="mbsIncentiveAutocompleteService.displayIncentiveRoleValue"></stal-autocomplete>
				<div *ngIf="!isValid(_newUpdateForm.controls['assignationRoleValue'])" class="filed-required">
					<span *ngIf="checkControlError(_newUpdateForm.controls['assignationRoleValue'], 'validatorHaveId')">La assignationRoleValue è richiesta.</span>
				</div>
			</div>
			<div class="col-12 md:col-6 lg:col-4">
				<span>{{ 'value' }}</span><span class="filed-required">*</span>
				<input type="number" pInputText formControlName="value" placeholder="Value">
				<div *ngIf="!isValid(_newUpdateForm.controls['value'])" class="filed-required">
					<span *ngIf="checkControlError(_newUpdateForm.controls['value'], 'required')">La value è richiesta.</span>
				</div>
			</div>

			<div class="col-12 md:col-6 lg:col-3">
				<br>
				<button pButton *ngIf="!_isUpdate" type="submit" color="accent">{{ 'Crea' }}</button>
				<button pButton class="p-button-outlined"  *ngIf="_isUpdate" type="submit" color="accent">{{ 'Aggiorna' }}</button>
			</div>

		</div>
	</form>
</div>

<div *ngIf="stepIs(formStep.LOADING)" fxLayoutAlign="center">
	loading
</div>

<div *ngIf="stepIs(formStep.COMPLETE)">
	<h1 *ngIf="!_isUpdate">{{ 'incentive-assignation-stage' }} {{ 'creato' }}</h1>
	<h1 *ngIf="_isUpdate">{{ 'incentive-assignation-stage' }} {{ 'aggiornato' }}</h1>

	<hr>

	<mbs-incentive-assignation-stage-detail-box [incentiveAssignationStage]="_result"></mbs-incentive-assignation-stage-detail-box>

	<div *ngIf="!_isUpdate">
		<button pButton color="primary" (click)="newIncentiveAssignationStage()">
			<span *ngIf="!returnToParent">{{ 'Crea nuovo' }}</span>
			<span *ngIf="returnToParent">{{ 'Modifica' }}</span>
		</button>
	</div>
</div>
