<ng-container *ngIf="governativeProcurementLot">
	<div class="h4 ml-16">ID: <b>{{ governativeProcurementLot.id }}</b></div>
	<div class="h4 ml-16">code: <b>{{ governativeProcurementLot.code }}</b></div>
	<div class="h4 ml-16">description: <b>{{ governativeProcurementLot.description }}</b></div>
	<div class="h4 ml-16">amount: <b>{{ governativeProcurementLot.amount }}</b></div>
</ng-container>
