<ng-container *ngIf="incentiveCalculationFactor">
	<div class="h4 ml-16">ID: <b>{{ incentiveCalculationFactor.id }}</b></div>
	<div class="h4 ml-16">minval: <b>{{ incentiveCalculationFactor.minval }}</b></div>
	<div class="h4 ml-16">maxval: <b>{{ incentiveCalculationFactor.maxval }}</b></div>
	<div class="h4 ml-16">defaultval: <b>{{ incentiveCalculationFactor.defaultval }}</b></div>
</ng-container>
