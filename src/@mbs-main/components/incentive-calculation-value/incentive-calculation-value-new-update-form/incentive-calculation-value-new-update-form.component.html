<div id="mbs-incentive-calculation-value-new-update-form" *ngIf="stepIs(formStep.FORM)">
	<form [formGroup]="_newUpdateForm" (ngSubmit)="submit()">
		<div class="grid p-fluid" style="margin-top: 0px;">

			<div class="col-12 md:col-6 lg:col-4" [hidden]="calculation != null">
				<span>{{ 'calculation' }}</span><span class="filed-required">*</span>
				<input type="text" pInputText formControlName="calculation" [stalAutocomplete]="calculationAutocomplete">
				<stal-autocomplete #calculationAutocomplete [filteredElements]="_filteredCalculation" [displayFn]="mbsMainAutocompleteService.displayIncentiveCalculation"></stal-autocomplete>
				<div *ngIf="!isValid(_newUpdateForm.controls['calculation'])" class="filed-required">
					<span *ngIf="checkControlError(_newUpdateForm.controls['calculation'], 'validatorHaveId')">La calculation è richiesta.</span>
				</div>
			</div>
			<div class="col-12 md:col-6 lg:col-4" [hidden]="regulationValue != null">
				<span>{{ 'regulationValue' }}</span><span class="filed-required">*</span>
				<input type="text" pInputText formControlName="regulationValue" [stalAutocomplete]="regulationValueAutocomplete">
				<stal-autocomplete #regulationValueAutocomplete [filteredElements]="_filteredRegulationValue" [displayFn]="mbsMainAutocompleteService.displayIncentiveRegulationValue"></stal-autocomplete>
				<div *ngIf="!isValid(_newUpdateForm.controls['regulationValue'])" class="filed-required">
					<span *ngIf="checkControlError(_newUpdateForm.controls['regulationValue'], 'validatorHaveId')">La regulationValue è richiesta.</span>
				</div>
			</div>
			<div class="col-12 md:col-6 lg:col-4">
				<span>{{ 'value' }}</span>
				<input type="number" pInputText formControlName="value" placeholder="Value">
			</div>

			<div class="col-12 md:col-6 lg:col-3">
				<br>
				<button pButton *ngIf="!_isUpdate" type="submit" color="accent">{{ 'Crea' }}</button>
				<button pButton class="p-button-outlined"  *ngIf="_isUpdate" type="submit" color="accent">{{ 'Aggiorna' }}</button>
			</div>

		</div>
	</form>
</div>

<div *ngIf="stepIs(formStep.LOADING)" fxLayoutAlign="center">
	loading
</div>

<div *ngIf="stepIs(formStep.COMPLETE)">
	<h1 *ngIf="!_isUpdate">{{ 'incentive-calculation-value' }} {{ 'creato' }}</h1>
	<h1 *ngIf="_isUpdate">{{ 'incentive-calculation-value' }} {{ 'aggiornato' }}</h1>

	<hr>

	<mbs-incentive-calculation-value-detail-box [incentiveCalculationValue]="_result"></mbs-incentive-calculation-value-detail-box>

	<div *ngIf="!_isUpdate">
		<button pButton color="primary" (click)="newIncentiveCalculationValue()">
			<span *ngIf="!returnToParent">{{ 'Crea nuovo' }}</span>
			<span *ngIf="returnToParent">{{ 'Modifica' }}</span>
		</button>
	</div>
</div>
