<ng-container *ngIf="incentiveWithheld">
	<div class="h4 ml-16">ID: <b>{{ incentiveWithheld.id }}</b></div>
	<div class="h4 ml-16">description: <b>{{ incentiveWithheld.description }}</b></div>
	<div class="h4 ml-16">active: <b>{{ incentiveWithheld.active }}</b></div>
	<div class="h4 ml-16">amount: <b>{{ incentiveWithheld.amount }}</b></div>
	<div class="h4 ml-16">percentage: <b>{{ incentiveWithheld.percentage }}</b></div>
</ng-container>
