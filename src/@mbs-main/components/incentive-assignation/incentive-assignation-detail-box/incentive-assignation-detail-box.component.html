<ng-container *ngIf="incentiveAssignation">
	<div class="h4 ml-16">ID: <b>{{ incentiveAssignation.id }}</b></div>
	<div class="h4 ml-16">value: <b>{{ incentiveAssignation.value }}</b></div>
	<div class="h4 ml-16">preAmount: <b>{{ incentiveAssignation.preAmount }}</b></div>
	<div class="h4 ml-16">amount: <b>{{ incentiveAssignation.amount }}</b></div>
</ng-container>
