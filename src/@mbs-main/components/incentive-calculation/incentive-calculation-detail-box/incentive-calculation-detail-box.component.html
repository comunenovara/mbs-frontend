<ng-container *ngIf="incentiveCalculation">
	<div class="h4 ml-16">ID: <b>{{ incentiveCalculation.id }}</b></div>
	<div class="h4 ml-16">description: <b>{{ incentiveCalculation.description }}</b></div>
	<div class="h4 ml-16">confirmed: <b>{{ incentiveCalculation.confirmed }}</b></div>
	<div class="h4 ml-16">preAmount: <b>{{ incentiveCalculation.preAmount }}</b></div>
	<div class="h4 ml-16">amount: <b>{{ incentiveCalculation.amount }}</b></div>
</ng-container>
