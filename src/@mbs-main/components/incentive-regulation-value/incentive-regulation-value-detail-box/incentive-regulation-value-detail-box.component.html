<ng-container *ngIf="incentiveRegulationValue">
	<div class="h4 ml-16">ID: <b>{{ incentiveRegulationValue.id }}</b></div>
	<div class="h4 ml-16">Minimo: <b>{{ incentiveRegulationValue.minval/100 | percent: '0.2'  }}</b></div>
	<div class="h4 ml-16">Massimo: <b>{{ incentiveRegulationValue.maxval/100 | percent: '0.2'  }}</b></div>
	<div class="h4 ml-16">Default: <b>{{ incentiveRegulationValue.defaultval/100 | percent: '0.2'  }}</b></div>
</ng-container>
