<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-stage-detail-box [incentiveStage]="incentiveStageDto"></mbs-incentive-stage-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveStage(incentiveStageDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveStage(incentiveStageDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveStageDto.procurementType !== null">
        <div class="card mb-0">
			<h3>procurement-type</h3>
			<mbs-procurement-type-detail-box [procurementType]="incentiveStageDto.procurementType" ></mbs-procurement-type-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../procurement-type/detail', incentiveStageDto.procurementType.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				
				[routerLink]="['../../../procurement-type/detail', incentiveStageDto.procurementType.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveStageDto.regulation !== null">
        <div class="card mb-0">
			<h3>incentive-regulation</h3>
			<mbs-incentive-regulation-detail-box [incentiveRegulation]="incentiveStageDto.regulation" ></mbs-incentive-regulation-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-regulation/detail', incentiveStageDto.regulation.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				
				[routerLink]="['../../../incentive-regulation/detail', incentiveStageDto.regulation.id]"></button>
			-->
		</div>
	</div>

	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-regulation-value</h3>
			<mbs-incentive-regulation-value-list-loader 
				[filters]="{stageIdEquals: incentiveStageDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveRegulationValueListPaginator"
				[buttons]="incentiveRegulationValueTableButtons"
				(resultCount)="incentiveRegulationValueCount=$event"></mbs-incentive-regulation-value-list-loader>
			<stal-paginator [totalRecords]="incentiveRegulationValueCount" [(pageable)]="incentiveRegulationValueListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveRegulationValue(incentiveStageDto)"></button>
		</div>
	</div>
</div>
