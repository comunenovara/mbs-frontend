<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-calculation-value-detail-box [incentiveCalculationValue]="incentiveCalculationValueDto"></mbs-incentive-calculation-value-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveCalculationValue(incentiveCalculationValueDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveCalculationValue(incentiveCalculationValueDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveCalculationValueDto.calculation !== null">
        <div class="card mb-0">
			<h3>incentive-calculation</h3>
			<mbs-incentive-calculation-detail-box [incentiveCalculation]="incentiveCalculationValueDto.calculation" ></mbs-incentive-calculation-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-calculation/detail', incentiveCalculationValueDto.calculation.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-calculation/detail', incentiveCalculationValueDto.calculation.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveCalculationValueDto.regulationValue !== null">
        <div class="card mb-0">
			<h3>incentive-regulation-value</h3>
			<mbs-incentive-regulation-value-detail-box [incentiveRegulationValue]="incentiveCalculationValueDto.regulationValue" ></mbs-incentive-regulation-value-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-regulation-value/detail', incentiveCalculationValueDto.regulationValue.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-regulation-value/detail', incentiveCalculationValueDto.regulationValue.id]"></button>
			-->
		</div>
	</div>

	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-assignation</h3>
			<mbs-incentive-assignation-list-loader 
				[filters]="{calculationValueIdEquals: incentiveCalculationValueDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveAssignationListPaginator"
				[buttons]="incentiveAssignationTableButtons"
				(resultCount)="incentiveAssignationCount=$event"></mbs-incentive-assignation-list-loader>
			<stal-paginator [totalRecords]="incentiveAssignationCount" [(pageable)]="incentiveAssignationListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveAssignation(incentiveCalculationValueDto)"></button>
		</div>
	</div>
</div>
