<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-governative-project-detail-box [governativeProject]="governativeProjectDto"></mbs-governative-project-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editGovernativeProject(governativeProjectDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteGovernativeProject(governativeProjectDto)"></button>
		</div>
	</div>


	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>Appalti collegati</h3>
			<mbs-governative-project-procurement-lot-list-loader 
				[filters]="{projectIdEquals: governativeProjectDto.id}" 
				[dcs]="['procurementLot.code', 'procurementLot.description', 'procurementLot.amount', 'amount']" 
				[paginator]="governativeProjectProcurementLotListPaginator"
				[buttons]="governativeProjectProcurementLotTableButtons"
				(resultCount)="governativeProjectProcurementLotCount=$event"></mbs-governative-project-procurement-lot-list-loader>
			<stal-paginator [totalRecords]="governativeProjectProcurementLotCount" [(pageable)]="governativeProjectProcurementLotListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewGovernativeProjectProcurementLot(governativeProjectDto)"></button>
		</div>
	</div>
</div>
