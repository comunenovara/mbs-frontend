<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-beneficiary-detail-box [incentiveBeneficiary]="incentiveBeneficiaryDto"></mbs-incentive-beneficiary-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveBeneficiary(incentiveBeneficiaryDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveBeneficiary(incentiveBeneficiaryDto)"></button>
		</div>
	</div>


	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>Ruoli da incentivi</h3>
			<mbs-incentive-role-assignation-list-loader 
				[filters]="{beneficiaryIdEquals: incentiveBeneficiaryDto.id}" 
				[dcs]="['calculation.description', 'role.description']" 
				[paginator]="incentiveRoleAssignationListPaginator"
				[buttons]="incentiveRoleAssignationTableButtons"
				(resultCount)="incentiveRoleAssignationCount=$event"></mbs-incentive-role-assignation-list-loader>
			<stal-paginator [totalRecords]="incentiveRoleAssignationCount" [(pageable)]="incentiveRoleAssignationListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveRoleAssignation(incentiveBeneficiaryDto)"></button>
		</div>
	</div>
</div>
