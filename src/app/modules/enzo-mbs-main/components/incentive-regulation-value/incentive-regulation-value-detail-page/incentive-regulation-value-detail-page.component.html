<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-regulation-value-detail-box [incentiveRegulationValue]="incentiveRegulationValueDto"></mbs-incentive-regulation-value-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveRegulationValue(incentiveRegulationValueDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveRegulationValue(incentiveRegulationValueDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveRegulationValueDto.stage !== null">
        <div class="card mb-0">
			<h3>incentive-stage</h3>
			<mbs-incentive-stage-detail-box [incentiveStage]="incentiveRegulationValueDto.stage" ></mbs-incentive-stage-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-stage/detail', incentiveRegulationValueDto.stage.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-stage/detail', incentiveRegulationValueDto.stage.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveRegulationValueDto.role !== null">
        <div class="card mb-0">
			<h3>incentive-role</h3>
			<mbs-incentive-role-detail-box [incentiveRole]="incentiveRegulationValueDto.role" ></mbs-incentive-role-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-role/detail', incentiveRegulationValueDto.role.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-role/detail', incentiveRegulationValueDto.role.id]"></button>
			-->
		</div>
	</div>

	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-calculation-value</h3>
			<mbs-incentive-calculation-value-list-loader 
				[filters]="{regulationValueIdEquals: incentiveRegulationValueDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveCalculationValueListPaginator"
				[buttons]="incentiveCalculationValueTableButtons"
				(resultCount)="incentiveCalculationValueCount=$event"></mbs-incentive-calculation-value-list-loader>
			<stal-paginator [totalRecords]="incentiveCalculationValueCount" [(pageable)]="incentiveCalculationValueListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveCalculationValue(incentiveRegulationValueDto)"></button>
		</div>
	</div>
</div>
