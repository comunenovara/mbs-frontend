<div class="grid">
    <div class="col-12 lg:col-12 xl:col-12">
        <div class="card mb-0">
			<div class="grid">
				<div class="col-6 lg:col-6 xl:col-6">
					<mbs-incentive-regulation-detail-box [incentiveRegulation]="incentiveRegulationDto"></mbs-incentive-regulation-detail-box>
				</div>
				<div class="col-6 lg:col-6 xl:col-6" style="text-align: right;">
					<button pButton pRipple type="button" icon="pi pi-pencil" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveRegulation(incentiveRegulationDto)"></button>
					<button pButton pRipple type="button" icon="pi pi-trash" label="Cancella" class="p-button-outlined p-button-danger ml-4" (click)="deleteIncentiveRegulation(incentiveRegulationDto)"></button>
				</div>
			</div>
			<div *ngIf="items">
				<p-tabMenu [model]="items"></p-tabMenu>
			</div>
		</div>
	</div>
</div>

<router-outlet *ngIf="true"></router-outlet>
