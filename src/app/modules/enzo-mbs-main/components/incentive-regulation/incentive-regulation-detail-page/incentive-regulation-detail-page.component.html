<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-regulation-detail-box [incentiveRegulation]="incentiveRegulationDto"></mbs-incentive-regulation-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveRegulation(incentiveRegulationDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveRegulation(incentiveRegulationDto)"></button>
		</div>
	</div>


	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-withheld</h3>
			<mbs-incentive-withheld-list-loader 
				[filters]="{regulationIdEquals: incentiveRegulationDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveWithheldListPaginator"
				[buttons]="incentiveWithheldTableButtons"
				(resultCount)="incentiveWithheldCount=$event"></mbs-incentive-withheld-list-loader>
			<stal-paginator [totalRecords]="incentiveWithheldCount" [(pageable)]="incentiveWithheldListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveWithheld(incentiveRegulationDto)"></button>
		</div>
	</div>
	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-calculation-method</h3>
			<mbs-incentive-calculation-method-list-loader 
				[filters]="{regulationIdEquals: incentiveRegulationDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveCalculationMethodListPaginator"
				[buttons]="incentiveCalculationMethodTableButtons"
				(resultCount)="incentiveCalculationMethodCount=$event"></mbs-incentive-calculation-method-list-loader>
			<stal-paginator [totalRecords]="incentiveCalculationMethodCount" [(pageable)]="incentiveCalculationMethodListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveCalculationMethod(incentiveRegulationDto)"></button>
		</div>
	</div>
	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-stage</h3>
			<mbs-incentive-stage-list-loader 
				[filters]="{regulationIdEquals: incentiveRegulationDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveStageListPaginator"
				[buttons]="incentiveStageTableButtons"
				(resultCount)="incentiveStageCount=$event"></mbs-incentive-stage-list-loader>
			<stal-paginator [totalRecords]="incentiveStageCount" [(pageable)]="incentiveStageListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveStage(incentiveRegulationDto)"></button>
		</div>
	</div>
	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-role</h3>
			<mbs-incentive-role-list-loader 
				[filters]="{regulationIdEquals: incentiveRegulationDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveRoleListPaginator"
				[buttons]="incentiveRoleTableButtons"
				(resultCount)="incentiveRoleCount=$event"></mbs-incentive-role-list-loader>
			<stal-paginator [totalRecords]="incentiveRoleCount" [(pageable)]="incentiveRoleListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveRole(incentiveRegulationDto)"></button>
		</div>
	</div>
	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-calculation</h3>
			<mbs-incentive-calculation-list-loader 
				[filters]="{regulationIdEquals: incentiveRegulationDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveCalculationListPaginator"
				[buttons]="incentiveCalculationTableButtons"
				(resultCount)="incentiveCalculationCount=$event"></mbs-incentive-calculation-list-loader>
			<stal-paginator [totalRecords]="incentiveCalculationCount" [(pageable)]="incentiveCalculationListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveCalculation(incentiveRegulationDto)"></button>
		</div>
	</div>
</div>
