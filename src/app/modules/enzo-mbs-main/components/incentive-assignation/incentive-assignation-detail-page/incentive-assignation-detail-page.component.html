<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-assignation-detail-box [incentiveAssignation]="incentiveAssignationDto"></mbs-incentive-assignation-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveAssignation(incentiveAssignationDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveAssignation(incentiveAssignationDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveAssignationDto.assignation !== null">
        <div class="card mb-0">
			<h3>incentive-role-assignation</h3>
			<mbs-incentive-role-assignation-detail-box [incentiveRoleAssignation]="incentiveAssignationDto.assignation" ></mbs-incentive-role-assignation-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-role-assignation/detail', incentiveAssignationDto.assignation.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-role-assignation/detail', incentiveAssignationDto.assignation.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveAssignationDto.calculationValue !== null">
        <div class="card mb-0">
			<h3>incentive-calculation-value</h3>
			<mbs-incentive-calculation-value-detail-box [incentiveCalculationValue]="incentiveAssignationDto.calculationValue" ></mbs-incentive-calculation-value-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-calculation-value/detail', incentiveAssignationDto.calculationValue.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-calculation-value/detail', incentiveAssignationDto.calculationValue.id]"></button>
			-->
		</div>
	</div>

</div>
