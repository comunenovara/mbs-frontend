<div class="card mb-0 relative">
	
	<mbs-incentive-calculation-method-list-loader 
		[dcs]="incentiveCalculationMethodListDc" [buttons]="tableButtons" 
		[paginator]="incentiveCalculationMethodListPaginator" (resultCount)="incentiveCalculationMethodCount=$event"> 
	</mbs-incentive-calculation-method-list-loader>

	<stal-paginator [totalRecords]="incentiveCalculationMethodCount" [(pageable)]="incentiveCalculationMethodListPaginator"></stal-paginator>

	<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveCalculationMethod()"></button>

</div>
