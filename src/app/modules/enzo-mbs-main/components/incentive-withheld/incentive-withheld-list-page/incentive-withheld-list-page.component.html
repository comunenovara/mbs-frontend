<div class="card mb-0 relative">
	
	<mbs-incentive-withheld-list-loader 
		[dcs]="incentiveWithheldListDc" [buttons]="tableButtons" 
		[paginator]="incentiveWithheldListPaginator" (resultCount)="incentiveWithheldCount=$event"> 
	</mbs-incentive-withheld-list-loader>

	<stal-paginator [totalRecords]="incentiveWithheldCount" [(pageable)]="incentiveWithheldListPaginator"></stal-paginator>

	<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveWithheld()"></button>

</div>
