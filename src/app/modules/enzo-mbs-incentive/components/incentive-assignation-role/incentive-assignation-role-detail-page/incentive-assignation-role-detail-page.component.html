<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-assignation-role-detail-box [incentiveAssignationRole]="incentiveAssignationRoleDto"></mbs-incentive-assignation-role-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveAssignationRole(incentiveAssignationRoleDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveAssignationRole(incentiveAssignationRoleDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveAssignationRoleDto.beneficiary !== null">
        <div class="card mb-0">
			<h3>beneficiary</h3>
			<mbs-beneficiary-detail-box [beneficiary]="incentiveAssignationRoleDto.beneficiary" ></mbs-beneficiary-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../beneficiary/detail', incentiveAssignationRoleDto.beneficiary.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../beneficiary/detail', incentiveAssignationRoleDto.beneficiary.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveAssignationRoleDto.assignationRole !== null">
        <div class="card mb-0">
			<h3>role</h3>
			<mbs-role-detail-box [role]="incentiveAssignationRoleDto.assignationRole" ></mbs-role-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../role/detail', incentiveAssignationRoleDto.assignationRole.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../role/detail', incentiveAssignationRoleDto.assignationRole.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveAssignationRoleDto.assignationStage !== null">
        <div class="card mb-0">
			<h3>incentive-assignation-stage</h3>
			<mbs-incentive-assignation-stage-detail-box [incentiveAssignationStage]="incentiveAssignationRoleDto.assignationStage" ></mbs-incentive-assignation-stage-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-assignation-stage/detail', incentiveAssignationRoleDto.assignationStage.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-assignation-stage/detail', incentiveAssignationRoleDto.assignationStage.id]"></button>
			-->
		</div>
	</div>

</div>
