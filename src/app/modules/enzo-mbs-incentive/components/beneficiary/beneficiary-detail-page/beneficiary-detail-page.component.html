<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-beneficiary-detail-box [beneficiary]="beneficiaryDto"></mbs-beneficiary-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editBeneficiary(beneficiaryDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteBeneficiary(beneficiaryDto)"></button>
		</div>
	</div>


	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-assignation-role</h3>
			<mbs-incentive-assignation-role-list-loader 
				[filters]="{beneficiaryIdEquals: beneficiaryDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveAssignationRoleListPaginator"
				[buttons]="incentiveAssignationRoleTableButtons"
				(resultCount)="incentiveAssignationRoleCount=$event"></mbs-incentive-assignation-role-list-loader>
			<stal-paginator [totalRecords]="incentiveAssignationRoleCount" [(pageable)]="incentiveAssignationRoleListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveAssignationRole(beneficiaryDto)"></button>
		</div>
	</div>
</div>
