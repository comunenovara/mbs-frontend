<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-calculation-detail-box [incentiveCalculation]="incentiveCalculationDto"></mbs-incentive-calculation-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveCalculation(incentiveCalculationDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveCalculation(incentiveCalculationDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveCalculationDto.procurement !== null">
        <div class="card mb-0">
			<h3>governative-procurement-lot</h3>
			<mbs-governative-procurement-lot-detail-box [governativeProcurementLot]="incentiveCalculationDto.procurement" ></mbs-governative-procurement-lot-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../governative-procurement-lot/detail', incentiveCalculationDto.procurement.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../governative-procurement-lot/detail', incentiveCalculationDto.procurement.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveCalculationDto.regulation !== null">
        <div class="card mb-0">
			<h3>incentive-regulation</h3>
			<mbs-incentive-regulation-detail-box [incentiveRegulation]="incentiveCalculationDto.regulation" ></mbs-incentive-regulation-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-regulation/detail', incentiveCalculationDto.regulation.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../incentive-regulation/detail', incentiveCalculationDto.regulation.id]"></button>
			-->
		</div>
	</div>

	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>incentive-role-value</h3>
			<mbs-incentive-role-value-list-loader 
				[filters]="{incentiveCalculationIdEquals: incentiveCalculationDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="incentiveRoleValueListPaginator"
				[buttons]="incentiveRoleValueTableButtons"
				(resultCount)="incentiveRoleValueCount=$event"></mbs-incentive-role-value-list-loader>
			<stal-paginator [totalRecords]="incentiveRoleValueCount" [(pageable)]="incentiveRoleValueListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveRoleValue(incentiveCalculationDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>Table</h3>
			<enzo-incentive-calculation-table></enzo-incentive-calculation-table>
		</div>
	</div>

	
</div>
