<div class="card mb-0 relative">
	
	<mbs-incentive-assignation-stage-list-loader 
		[dcs]="incentiveAssignationStageListDc" [buttons]="tableButtons" 
		[paginator]="incentiveAssignationStageListPaginator" (resultCount)="incentiveAssignationStageCount=$event"> 
	</mbs-incentive-assignation-stage-list-loader>

	<stal-paginator [totalRecords]="incentiveAssignationStageCount" [(pageable)]="incentiveAssignationStageListPaginator"></stal-paginator>

	<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewIncentiveAssignationStage()"></button>

</div>
