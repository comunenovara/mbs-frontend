<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-incentive-assignation-stage-detail-box [incentiveAssignationStage]="incentiveAssignationStageDto"></mbs-incentive-assignation-stage-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editIncentiveAssignationStage(incentiveAssignationStageDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteIncentiveAssignationStage(incentiveAssignationStageDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveAssignationStageDto.assignationRole !== null">
        <div class="card mb-0">
			<h3>incentive-assignation-role</h3>
			<mbs-incentive-assignation-role-detail-box [incentiveAssignationRole]="incentiveAssignationStageDto.assignationRole" ></mbs-incentive-assignation-role-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-assignation-role/detail', incentiveAssignationStageDto.assignationRole.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				
				[routerLink]="['../../../incentive-assignation-role/detail', incentiveAssignationStageDto.assignationRole.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="incentiveAssignationStageDto.assignationRoleValue !== null">
        <div class="card mb-0">
			<h3>incentive-role-value</h3>
			<mbs-incentive-role-value-detail-box [incentiveRoleValue]="incentiveAssignationStageDto.assignationRoleValue" ></mbs-incentive-role-value-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../incentive-role-value/detail', incentiveAssignationStageDto.assignationRoleValue.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				
				[routerLink]="['../../../incentive-role-value/detail', incentiveAssignationStageDto.assignationRoleValue.id]"></button>
			-->
		</div>
	</div>

</div>
