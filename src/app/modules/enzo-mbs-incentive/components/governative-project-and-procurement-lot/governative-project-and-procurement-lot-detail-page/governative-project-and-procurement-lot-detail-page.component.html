<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-governative-project-and-procurement-lot-detail-box [governativeProjectAndProcurementLot]="governativeProjectAndProcurementLotDto"></mbs-governative-project-and-procurement-lot-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editGovernativeProjectAndProcurementLot(governativeProjectAndProcurementLotDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteGovernativeProjectAndProcurementLot(governativeProjectAndProcurementLotDto)"></button>
		</div>
	</div>

	<div class="col-12 lg:col-6 xl:col-3" *ngIf="governativeProjectAndProcurementLotDto.governativeProject !== null">
        <div class="card mb-0">
			<h3>governative-project</h3>
			<mbs-governative-project-detail-box [governativeProject]="governativeProjectAndProcurementLotDto.governativeProject" ></mbs-governative-project-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../governative-project/detail', governativeProjectAndProcurementLotDto.governativeProject.id]"></button>
			<!--
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../governative-project/detail', governativeProjectAndProcurementLotDto.governativeProject.id]"></button>
			-->
		</div>
	</div>
	<div class="col-12 lg:col-6 xl:col-3" *ngIf="governativeProjectAndProcurementLotDto.governativeProcurementLot !== null">
        <div class="card mb-0">
			<h3>governative-procurement-lot</h3>
			<mbs-governative-procurement-lot-detail-box [governativeProcurementLot]="governativeProjectAndProcurementLotDto.governativeProcurementLot" ></mbs-governative-procurement-lot-detail-box>
			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				[routerLink]="['../../../governative-procurement-lot/detail', governativeProjectAndProcurementLotDto.governativeProcurementLot.id]"></button>

			<button pButton pRipple type="button" label="Dettagli" class="p-button-outlined" 
				(click)="tabManagerService.openInCard()" 
				[routerLink]="['../../../governative-procurement-lot/detail', governativeProjectAndProcurementLotDto.governativeProcurementLot.id]"></button>
			-->
		</div>
	</div>

</div>
