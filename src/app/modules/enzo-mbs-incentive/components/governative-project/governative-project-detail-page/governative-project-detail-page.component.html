<div class="grid">
    <div class="col-12 lg:col-6 xl:col-6">
        <div class="card mb-0">
			<mbs-governative-project-detail-box [governativeProject]="governativeProjectDto"></mbs-governative-project-detail-box>
			<button pButton pRipple type="button" label="Modifica" class="p-button-outlined p-button-secondary" (click)="editGovernativeProject(governativeProjectDto)"></button>
			<button pButton pRipple type="button" label="Cancella" class="p-button-outlined p-button-danger" (click)="deleteGovernativeProject(governativeProjectDto)"></button>
		</div>
	</div>


	<div class="col-12 lg:col-12 xl:col-12">
		<div class="card mb-0 relative">
			<h3>governative-project-and-procurement-lot</h3>
			<mbs-governative-project-and-procurement-lot-list-loader 
				[filters]="{governativeProjectIdEquals: governativeProjectDto.id}" 
				[dcs]="['id', 'description']" 
				[paginator]="governativeProjectAndProcurementLotListPaginator"
				[buttons]="governativeProjectAndProcurementLotTableButtons"
				(resultCount)="governativeProjectAndProcurementLotCount=$event"></mbs-governative-project-and-procurement-lot-list-loader>
			<stal-paginator [totalRecords]="governativeProjectAndProcurementLotCount" [(pageable)]="governativeProjectAndProcurementLotListPaginator"></stal-paginator>
			<button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded create-button" (click)="createNewGovernativeProjectAndProcurementLot(governativeProjectDto)"></button>
		</div>
	</div>
</div>
